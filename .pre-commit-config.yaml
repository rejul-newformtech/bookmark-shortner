repos:
  # General pre-commit cleanups
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Ruff: Linting + formatting for FastAPI/Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      # Linter with auto-fix
      - id: ruff
        args: [--fix]

      # Formatter
      - id: ruff-format

  # Mypy: Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        args:
          - --explicit-package-bases
        exclude: ^alembic/
        additional_dependencies:
          - pydantic
          - fastapi
          - python-dotenv
          - passlib
          - types-passlib
          - types-python-jose
          - sqlalchemy[mypy]
          - pydantic-settings
          - pytest
          - pytest-asyncio
          - httpx
