repos:
  # General pre-commit cleanups
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Ruff: Replaces Flake8, Black, and isort for FastAPI
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      # Run the linter and auto-fix simple issues
      - id: ruff
        args: [--fix]
      # Run the code formatter
      - id: ruff-format

  # Mypy: Type checking for FastAPI routes & Pydantic models
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--explicit-package-bases]
        exclude: ^alembic/
        additional_dependencies:
          - pydantic
          - fastapi
          - pydantic
          - python-dotenv
          - sqlalchemy[mypy]
