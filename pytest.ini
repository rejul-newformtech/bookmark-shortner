[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Minimum Python version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Test timeout (seconds)
timeout = 30

# Show extra test summary info
addopts =
    -ra
    --strict-markers
    --disable-warnings

# Markers for organizing tests
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests related to authentication
    bookmarks: marks tests related to bookmarks
    users: marks tests related to users
    schemas: marks tests related to schemas
    crud: marks tests related to CRUD operations
    utils: marks tests related to utility functions

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG
